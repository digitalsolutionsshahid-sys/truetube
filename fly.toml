# fly.toml app configuration file for truetube
app = 'truetube'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  TRUETUBE_HOST = '0.0.0.0'
  TRUETUBE_PORT = '8000'
  TRUETUBE_ALLOWED_ORIGINS = '*'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
